name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # pushes to main are tested by the deploy workflow

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
